    <script>
      window.addEventListener("load", () => {
        const portraitImages = [
          "/images/victor/vic1.jpg",
          "/images/victor/vic2.jpg",
          "/images/victor/vic3.jpg",
          "/images/victor/1.jpeg",
          "/images/victor/2.jpeg",
        ];

        const preloadPortraits = () => {
          window.__portfolioPreloadedImages = portraitImages.map((src) => {
            const image = new Image();
            image.decoding = "async";
            image.fetchPriority = "low";
            image.src = src;
            return image;
          });
        };

        if ("requestIdleCallback" in window) {
          requestIdleCallback(preloadPortraits, { timeout: 3000 });
        } else {
          setTimeout(preloadPortraits, 1500);
        }
      });
    </script>
